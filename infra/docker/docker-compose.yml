
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports: ["9092:9092"]
    restart: unless-stopped
    depends_on: [zookeeper]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  api-gateway:
    build:
      context: ../..
      dockerfile: apps/api-gateway/Dockerfile
    ports: ["3000:3000"]
    env_file: ../../.env
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://admin:password@mongo:27017/notifications?authSource=admin
    depends_on: [mongo]

  event-ingestor:
    build:
      context: ../..
      dockerfile: apps/event-ingestor/Dockerfile
    ports: ["3001:3001"]
    env_file: ../../.env
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on: [kafka]

  event-router:
    build:
      context: ../..
      dockerfile: apps/event-router/Dockerfile
    env_file: ../../.env
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://admin:password@mongo:27017/notifications?authSource=admin
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on: [mongo, kafka, redis]

  delivery-service:
    build:
      context: ../..
      dockerfile: apps/delivery-service/Dockerfile
    env_file: ../../.env
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://admin:password@mongo:27017/notifications?authSource=admin
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on: [mongo, kafka, redis]

  ws-gateway:
    build:
      context: ../..
      dockerfile: apps/ws-gateway/Dockerfile
    ports: ["3002:3002"]
    env_file: ../../.env
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ""
    ports: ["80:80"]
    restart: unless-stopped
    depends_on: [api-gateway, ws-gateway]

volumes:
  mongo_data:
